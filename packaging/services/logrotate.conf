# Junction logs (OpenRC writes them to files; with systemd most go to the journal).
/var/log/junctiond.log /var/log/sing-box.log /var/log/junction-tproxy.log /var/log/gateway-failover.log {
    weekly
    rotate 4
    compress
    missingok
    notifempty
    copytruncate
}
